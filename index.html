<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pueblo Eats</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#F7F4E9;
    --card:#FFFDF8;
    --ink:#22221C;
    --ink-soft:#666352;
    --clay:#A93226;
    --clay-soft:#EAD3CE;
    --turquoise:#1E5C52;
    --ochre:#D9A233;
    --line:#E2DEC7;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Karla',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:900px;
    margin:0 auto;
    padding:32px 20px 80px;
  }
  header{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:8px;
    border-bottom:3px solid var(--turquoise);
    padding-bottom:18px;
    margin-bottom:24px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:2.1rem;
    margin:0;
    letter-spacing:-0.01em;
  }
  h1 span{color:var(--clay);}
  .tagline{
    font-size:0.95rem;
    color:var(--ink-soft);
    margin:0;
    max-width:340px;
  }
  nav.views{
    display:flex;
    gap:6px;
    margin-bottom:20px;
  }
  nav.views button{
    font-family:'Karla',sans-serif;
    font-size:0.9rem;
    font-weight:600;
    padding:8px 16px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  nav.views button.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--bg);
  }
  .nav-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .nav-row .period{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.3rem;
  }
  .nav-row .controls{
    display:flex;
    gap:6px;
    align-items:center;
  }
  .nav-row button.step{
    width:34px;height:34px;
    border-radius:8px;
    border:1.5px solid var(--line);
    background:var(--card);
    font-size:1rem;
    cursor:pointer;
    color:var(--ink);
  }
  .nav-row button.today{
    border-radius:8px;
    border:1.5px solid var(--line);
    background:var(--card);
    padding:0 14px;
    height:34px;
    font-family:'Karla',sans-serif;
    font-weight:600;
    font-size:0.85rem;
    cursor:pointer;
    color:var(--ink-soft);
  }

  /* MONTH VIEW */
  .month-grid{
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr));
    gap:6px;
  }
  .dow{
    font-size:0.75rem;
    font-weight:600;
    color:var(--ink-soft);
    text-align:left;
    padding:4px 6px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .day-cell{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    min-height:64px;
    padding:6px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    overflow:hidden;
    transition:border-color .15s ease;
  }
  .day-cell:hover{border-color:var(--clay);}
  .day-cell.empty{background:transparent;border-color:transparent;cursor:default;}
  .day-cell.today{border-color:var(--turquoise);border-width:2px;}
  .day-num{font-size:0.8rem;font-weight:600;color:var(--ink-soft);}
  .day-cell.today .day-num{color:var(--turquoise);}
  .badge{
    align-self:flex-end;
    width:22px;
    height:22px;
    flex-shrink:0;
    background:var(--clay);
    color:#fff;
    font-size:0.72rem;
    font-weight:700;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .feast-mark{
    font-size:0.7rem;
    color:var(--ochre);
    line-height:1;
  }
  .feast-banner{
    background:#FBF1DA;
    border:1.5px solid var(--ochre);
    border-radius:var(--radius);
    padding:10px 14px;
    margin-bottom:14px;
    font-size:0.88rem;
    color:#7A5A16;
    font-weight:600;
  }

  /* WEEK VIEW */
  .week-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:10px;
  }
  .week-col{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:10px;
    min-height:140px;
  }
  .week-col-head{
    font-size:0.75rem;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .week-col-head .num{color:var(--ink);font-size:0.95rem;}
  .week-col.today{border-color:var(--turquoise);border-width:2px;}
  .mini-card{
    font-size:0.78rem;
    padding:6px 8px;
    background:var(--bg);
    border-radius:7px;
    margin-bottom:6px;
    cursor:pointer;
    border:1px solid var(--line);
  }
  .mini-card .mini-name{font-weight:700;display:block;}

  /* DAY VIEW / LISTINGS */
  .listings{display:flex;flex-direction:column;gap:12px;}
  .empty-state{
    color:var(--ink-soft);
    font-style:italic;
    padding:30px 0;
    text-align:center;
  }
  .vendor-card{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:16px 18px;
    cursor:pointer;
  }
  .vendor-card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
  }
  .vendor-name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.15rem;
    margin:0 0 4px;
  }
  .vendor-sub{
    font-size:0.85rem;
    color:var(--ink-soft);
    margin:0;
  }
  .vendor-sub b{color:var(--ink);font-weight:600;}
  .chip{
    font-size:0.72rem;
    font-weight:700;
    padding:3px 10px;
    border-radius:999px;
    white-space:nowrap;
  }
  .chip.pickup{background:#E4EDE9;color:var(--turquoise);}
  .chip.delivery{background:#FBEEDD;color:var(--ochre);}
  .chip.both{background:var(--clay-soft);color:var(--clay);}
  .vendor-details{
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--line);
    display:none;
    font-size:0.9rem;
    line-height:1.55;
  }
  .vendor-card.open .vendor-details{display:block;}
  .detail-row{margin-bottom:10px;}
  .detail-label{
    font-weight:700;
    color:var(--ink);
    display:block;
    margin-bottom:2px;
    font-size:0.8rem;
  }
  .menu-list{margin:0;padding:0;list-style:none;}
  .menu-list li{
    display:flex;
    justify-content:space-between;
    padding:3px 0;
    border-bottom:1px dotted var(--line);
  }
  .menu-list li:last-child{border-bottom:none;}
  .contact-note{
    color:var(--ink-soft);
    font-style:italic;
    font-size:0.85rem;
  }
  .view{display:none;}
  .view.active{display:block;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Pueblo <span>Eats</span></h1>
    <div style="text-align:left;">
      <p class="tagline">What's there to eat?! Click a day to see!</p>
      <a href="https://forms.gle/rjuh9FAVqehJXCvk7" target="_blank" rel="noopener"
         style="display:inline-block;margin-top:6px;font-size:0.85rem;font-weight:700;color:#fff;background:var(--clay);padding:7px 16px;border-radius:999px;text-decoration:none;">
        Post your food sale →
      </a>
    </div>
  </header>

  <p style="font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);margin:0 0 6px;">Views</p>
  <nav class="views">
    <button data-view="month" class="active">Month</button>
    <button data-view="week">Week</button>
    <button data-view="day">Day</button>
    <button data-view="list">List</button>
  </nav>

  <p id="filterLabel" style="font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);margin:18px 0 6px;">Craving something specific?</p>
  <div id="filterBar" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;"></div>

  <p id="villageFilterLabel" style="font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);margin:0 0 6px;">Where can you get it?</p>
  <div id="villageFilterBar" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;"></div>

  <div class="nav-row" id="navRow">
    <div class="period" id="periodLabel"></div>
    <div class="controls">
      <button class="step" id="prevBtn">‹</button>
      <button class="today" id="todayBtn">Today</button>
      <button class="step" id="nextBtn">›</button>
    </div>
  </div>

  <div class="view active" id="view-month">
    <div class="month-grid" id="monthGrid"></div>
  </div>

  <div class="view" id="view-week">
    <div class="week-grid" id="weekGrid"></div>
  </div>

  <div class="view" id="view-day">
    <div class="listings" id="dayListings"></div>
  </div>

  <div class="view" id="view-list">
    <div class="listings" id="listListings"></div>
  </div>

  <p id="statusNote" style="margin-top:28px;font-size:0.8rem;color:var(--ink-soft);"></p>
  <p style="font-size:0.8rem;color:var(--ink-soft);margin-top:6px;">
    Questions or issues? Email <a href="mailto:KewaEats@gmail.com" style="color:var(--clay);font-weight:600;">KewaEats@gmail.com</a>
  </p>
</div>

<script>
/* ---------- LIVE DATA SOURCE ---------- */
/* Published Google Sheet (CSV). Replace this URL with your own
   Form's "Publish to web" CSV link if it ever changes. */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT4_0mu-yOrsPJgBDRm1VWApdorxUFEj2OKhvL1kK6_4GP-_s8JIFolli1tkZo6oo0ez-PygVtPqQTU/pub?gid=1572425320&single=true&output=csv";

// Fallback sample data, used only if the live fetch fails (e.g. offline preview)
// TEMP: using your real BobaStuff test submission here to verify parsing logic
const FALLBACK_SALES = [
  {
    vendor: "BobaStuff",
    items: ["Milk Tea Boba $5", "Plain Tea $5", "Fruit Tea $6", "Frybread $10"],
    date: "2026-09-26",
    time: "7am to 11am",
    fulfillment: "pickup",
    location: "Community Center",
    payment: "Cash, tap to pay",
    contactPublic: true,
    contact: "text: 555-555-5555",
    categories: ["Drinks", "Frybread"]
  }
];

let SALES = [];

/* ---------- FEAST DAYS ---------- */
/* New Mexico Pueblo feast days. Month/day repeat every year regardless
   of which year is being viewed. */
const FEAST_DAYS = [
  { month:1,  day:23, name:"Pueblo de San Ildefonso" },
  { month:3,  day:19, name:"Pueblo of Laguna" },
  { month:5,  day:1,  name:"Pueblo of San Felipe" },
  { month:6,  day:13, name:"Pueblo of Sandia" },
  { month:6,  day:24, name:"Ohkay Owingeh" },
  { month:7,  day:14, name:"Pueblo de Cochiti" },
  { month:7,  day:26, name:"Pueblo of Santa Ana" },
  { month:8,  day:2,  name:"Pueblo of Jemez" },
  { month:8,  day:4,  name:"Santo Domingo Pueblo" },
  { month:8,  day:10, name:"Picuris Pueblo" },
  { month:8,  day:12, name:"Santa Clara Pueblo" },
  { month:8,  day:15, name:"Pueblo of Zia" },
  { month:8,  day:28, name:"Pueblo of Isleta" },
  { month:9,  day:2,  name:"Pueblo of Acoma" },
  { month:9,  day:19, name:"Pueblo of Laguna" },
  { month:9,  day:30, name:"Taos Pueblo" },
  { month:10, day:4,  name:"Nambé Pueblo" },
  { month:11, day:12, name:"Pueblo of Jemez" },
  { month:11, day:12, name:"Pueblo of Tesuque" },
  { month:12, day:12, name:"Pueblo of Pojoaque" }
];

function feastsForDate(dateObj){
  const m = dateObj.getMonth()+1, d = dateObj.getDate();
  return FEAST_DAYS.filter(f => f.month===m && f.day===d);
}

function parseFormDate(raw){
  // Google Forms date question submits as M/D/YYYY
  const parts = raw.trim().split('/');
  if(parts.length !== 3) return null;
  const [m,d,y] = parts.map(n=>parseInt(n,10));
  return `${y}-${pad(m)}-${pad(d)}`;
}

function fulfillmentFromAnswer(raw){
  const v = (raw||'').toLowerCase();
  if(v.includes('both') || (v.includes('pick') && v.includes('deliver'))) return 'both';
  if(v.includes('deliver')) return 'delivery';
  return 'pickup';
}

// Treats blank/"no"/"n/a"/"none" style answers on optional fields as empty,
// so a vendor typing "No" instead of leaving it blank doesn't clutter the card.
function meaningfulText(raw){
  const v = (raw||'').trim();
  if(!v) return '';
  const flat = v.toLowerCase().replace(/[.\s]/g,'');
  if(flat === 'no' || flat === 'na' || flat === 'none') return '';
  return v;
}

function rowToSale(row){
  const dateKey = parseFormDate(row['When is your food sale?'] || '');
  if(!dateKey) return null; // skip malformed/incomplete rows
  const itemsRaw = row['What are you going to sell?'] || row['What is your menu?'] || '';
  const items = itemsRaw.split('\n').map(s=>s.trim()).filter(Boolean);
  const contactAnswer = (row['Can we post your contact info on the site?'] || '').trim().toLowerCase();
  const categoriesRaw = row['Help buyers find specific kinds of foods. Check all that apply to your food sale.'] || row['Categories (check all that apply)'] || '';
  const allCategories = categoriesRaw.split(',').map(c=>c.trim()).filter(Boolean);
  const preorderCategoryChecked = allCategories.some(c => c.toLowerCase() === 'pre-order' || c.toLowerCase() === 'preorder');
  const categories = allCategories.filter(c => c.toLowerCase() !== 'pre-order' && c.toLowerCase() !== 'preorder');

  // Recurring: Yes/No question with a branched follow-up shown only if Yes.
  // (Not currently on the live form — these will just come back empty/false,
  // which is harmless if the question isn't asked.)
  const recurringAnswer = (row['Is this a recurring food sale?'] || '').trim().toLowerCase();
  const isRecurring = recurringAnswer.startsWith('yes');
  const recurringDetails = meaningfulText(row['Tell us when you usually have your food sale:'] || '');

  // Pre-orders: simple Yes/No question, OR the "Pre-order" Categories
  // checkbox — either signals pre-order status. No separate deadline-detail
  // field on the current form, so preorderDetails falls back to a generic note.
  const preorderAnswer = (row['Can buyers place pre-orders?'] || row['Taking pre-orders? (optional)'] || '').trim().toLowerCase();
  const preorderAnswerYes = preorderAnswer.startsWith('yes');
  const isPreorder = preorderAnswerYes || preorderCategoryChecked;
  const preorderDetails = meaningfulText(row['Tell us about your Pre-order requirements:'] || '');

  // General catch-all for misc notes (allergy info, etc). Checks several
  // title variants since the form's exact wording has changed a few times.
  const notes = meaningfulText(
    row['Any additional details you want to share with potential buyers?']
    || row['Any additional detail you want to share with potential buyers?']
    || row['Anything else buyers should know (optional)']
    || row['Anything else buyers should know? (optional)']
    || ''
  );

  const basedIn = (row['Where are you based?'] || '').trim();
  const openToRaw = row['Which communities/villages is sale open to?'] || '';
  const openTo = openToRaw.split(',').map(v=>v.trim()).filter(Boolean);

  const locationType = (row['Where can buyers find you?'] || '').trim();
  const locationDetails = (row['Add home address if selling from home.'] || row['Location details (optional)'] || '').trim();
  const location = locationDetails ? `${locationType} — ${locationDetails}` : locationType;

  return {
    vendor: (row['Vendor/Business Name']||'Unnamed vendor').trim(),
    basedIn: basedIn,
    openTo: openTo,
    items: items.length ? items : ['Menu not listed'],
    date: dateKey,
    time: (row['What time is your food sale?']||'').trim(),
    fulfillment: fulfillmentFromAnswer(row['Pickup only, delivery only, or both?']),
    location: location,
    payment: (row['How can people pay? (mark all that apply)']||'').trim(),
    contactPublic: contactAnswer.startsWith('yes'),
    contact: (row['Contact info and preferences']||'').trim(),
    notes: notes,
    isRecurring: isRecurring,
    recurringDetails: recurringDetails,
    preorderDetails: preorderDetails,
    categories: categories,
    isPreorder: isPreorder
  };
}

function loadData(){
  Papa.parse(CSV_URL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results){
      const parsed = results.data.map(rowToSale).filter(Boolean);
      SALES = parsed.length ? parsed : FALLBACK_SALES;
      rebuildIndexAndRender('live');
    },
    error: function(){
      SALES = FALLBACK_SALES;
      rebuildIndexAndRender('offline');
    }
  });
}

/* ---------- helpers ---------- */
const $ = sel => document.querySelector(sel);
const pad = n => String(n).padStart(2,'0');
const fmtKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
let salesByDate = {};
let activeFilters = new Set();
let activeVillageFilters = new Set();

function getFilteredSales(){
  return SALES.filter(s => {
    const catMatch = activeFilters.size === 0 || s.categories.some(c => activeFilters.has(c));
    const villageMatch = activeVillageFilters.size === 0 || (s.openTo||[]).some(v => activeVillageFilters.has(v));
    return catMatch && villageMatch;
  });
}

function renderFilterBar(){
  const allCats = new Set();
  SALES.forEach(s => s.categories.forEach(c => allCats.add(c)));
  const bar = $('#filterBar');
  const label = $('#filterLabel');
  if(allCats.size === 0){ bar.innerHTML = ''; label.style.display = 'none'; return; }
  label.style.display = 'block';

  const chips = Array.from(allCats).sort().map(cat => {
    const active = activeFilters.has(cat);
    return `<button class="filter-chip${active?' active':''}" data-cat="${cat}"
      style="font-size:0.8rem;font-weight:600;padding:6px 14px;border-radius:999px;
      border:1.5px solid ${active?'var(--turquoise)':'var(--line)'};
      background:${active?'var(--turquoise)':'var(--card)'};
      color:${active?'#fff':'var(--ink-soft)'};cursor:pointer;">${cat}</button>`;
  }).join('');

  bar.innerHTML = chips;
  bar.querySelectorAll('.filter-chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const cat = btn.dataset.cat;
      if(activeFilters.has(cat)) activeFilters.delete(cat);
      else activeFilters.add(cat);
      reindexAndRender();
    });
  });
}

function renderVillageFilterBar(){
  const allVillages = new Set();
  SALES.forEach(s => (s.openTo||[]).forEach(v => allVillages.add(v)));
  const bar = $('#villageFilterBar');
  const label = $('#villageFilterLabel');
  if(allVillages.size === 0){ bar.innerHTML = ''; label.style.display = 'none'; return; }
  label.style.display = 'block';

  const chips = Array.from(allVillages).sort().map(v => {
    const active = activeVillageFilters.has(v);
    return `<button class="filter-chip" data-village="${v}"
      style="font-size:0.8rem;font-weight:600;padding:6px 14px;border-radius:999px;
      border:1.5px solid ${active?'var(--clay)':'var(--line)'};
      background:${active?'var(--clay)':'var(--card)'};
      color:${active?'#fff':'var(--ink-soft)'};cursor:pointer;">${v}</button>`;
  }).join('');

  bar.innerHTML = chips;
  bar.querySelectorAll('.filter-chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const v = btn.dataset.village;
      if(activeVillageFilters.has(v)) activeVillageFilters.delete(v);
      else activeVillageFilters.add(v);
      reindexAndRender();
    });
  });
}

function reindexAndRender(){
  salesByDate = {};
  getFilteredSales().forEach(s => { (salesByDate[s.date] = salesByDate[s.date] || []).push(s); });
  renderFilterBar();
  renderVillageFilterBar();
  render();
}

function rebuildIndexAndRender(status){
  const note = $('#statusNote');
  if(status === 'live'){
    note.textContent = `Loaded ${SALES.length} posting${SALES.length===1?'':'s'} from the live form responses.`;
  } else {
    note.textContent = `Couldn't reach the live sheet — showing sample data instead.`;
  }
  reindexAndRender();
}

const today = new Date();
today.setHours(0,0,0,0);

let currentView = 'month';
let cursor = new Date(today); // drives whichever view is active
let selectedDay = new Date(today);

const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const dowShort = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

/* ---------- rendering ---------- */
function fulfillmentChip(f){
  if(f === 'pickup') return '<span class="chip pickup">Pickup</span>';
  if(f === 'delivery') return '<span class="chip delivery">Delivery</span>';
  return '<span class="chip both">Pickup or delivery</span>';
}

function vendorCard(sale, forceOpen){
  const menu = sale.items.map(i => {
    const m = i.match(/^(.*?)(\$\d+(\.\d+)?)$/);
    if(m) return `<li><span>${m[1].trim()}</span><span>${m[2]}</span></li>`;
    return `<li><span>${i}</span></li>`;
  }).join('');

  const contactBlock = sale.contactPublic
    ? `<div class="detail-row"><span class="detail-label">Contact</span>${sale.contact}</div>`
    : `<div class="detail-row"><span class="detail-label">Contact</span><span class="contact-note">Kept private by vendor — check back or look for their posted flyer.</span></div>`;

  const notesBlock = sale.notes
    ? `<div class="detail-row"><span class="detail-label">Good to know</span>${sale.notes}</div>`
    : '';

  const recurringBlock = sale.isRecurring
    ? `<div class="detail-row"><span class="detail-label">Recurring</span>${sale.recurringDetails || 'Contact vendor for schedule details.'}</div>`
    : '';

  const preorderBlock = sale.isPreorder
    ? `<div class="detail-row"><span class="detail-label">Pre-order details</span>${sale.preorderDetails || 'Contact vendor for order details and deadline.'}</div>`
    : '';

  const preorderBadge = sale.isPreorder
    ? `<span class="chip" style="background:#F5E7C4;color:#8A6A1E;">Pre-order</span>`
    : '';

  const recurringBadge = sale.isRecurring
    ? `<span class="chip" style="background:#E4EDE9;color:var(--turquoise);">Recurring</span>`
    : '';

  const basedInLine = sale.basedIn
    ? `<p class="vendor-sub" style="margin-top:2px;">Based in ${sale.basedIn}</p>`
    : '';

  const openToTags = (sale.openTo && sale.openTo.length)
    ? sale.openTo.map(v=>
        `<span style="font-size:0.7rem;font-weight:700;color:var(--clay);background:var(--clay-soft);padding:2px 9px;border-radius:999px;">${v}</span>`
      ).join('')
    : '';

  const catTags = (sale.categories && sale.categories.length)
    ? `<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px;">${sale.categories.map(c=>
        `<span style="font-size:0.7rem;font-weight:600;color:var(--turquoise);background:#EAF1E8;padding:2px 9px;border-radius:999px;">${c}</span>`
      ).join('')}</div>`
    : '';

  return `
    <div class="vendor-card${forceOpen ? ' open' : ''}">
      <div class="vendor-card-top">
        <div>
          <p class="vendor-name">${sale.vendor}</p>
          ${basedInLine}
          <p class="vendor-sub"><b>${sale.time}</b></p>
          <p class="vendor-sub" style="margin-top:2px;">${sale.location}</p>
          ${openToTags ? `<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px;"><span style="font-size:0.7rem;color:var(--ink-soft);align-self:center;">Open to:</span>${openToTags}</div>` : ''}
          ${catTags}
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;">
          ${fulfillmentChip(sale.fulfillment)}
          ${preorderBadge}
          ${recurringBadge}
        </div>
      </div>
      <div class="vendor-details">
        <div class="detail-row">
          <span class="detail-label">Menu</span>
          <ul class="menu-list">${menu}</ul>
        </div>
        <div class="detail-row"><span class="detail-label">Location & Instructions</span>${sale.location}</div>
        <div class="detail-row"><span class="detail-label">Payment</span>${sale.payment}</div>
        ${recurringBlock}
        ${preorderBlock}
        ${notesBlock}
        ${contactBlock}
      </div>
    </div>`;
}

function attachCardToggles(root){
  root.querySelectorAll('.vendor-card').forEach(card=>{
    card.addEventListener('click', ()=> card.classList.toggle('open'));
  });
}

function renderMonth(){
  const y = cursor.getFullYear(), m = cursor.getMonth();
  $('#periodLabel').textContent = `${monthNames[m]} ${y}`;
  const grid = $('#monthGrid');
  grid.innerHTML = dowShort.map(d=>`<div class="dow">${d}</div>`).join('');

  const firstDay = new Date(y, m, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();

  for(let i=0;i<startOffset;i++){
    grid.innerHTML += `<div class="day-cell empty"></div>`;
  }
  for(let d=1; d<=daysInMonth; d++){
    const dateObj = new Date(y,m,d);
    const key = fmtKey(dateObj);
    const isToday = key === fmtKey(today);
    const count = (salesByDate[key]||[]).length;
    const feasts = feastsForDate(dateObj);
    const feastTitle = feasts.map(f=>f.name).join(', ');
    grid.innerHTML += `
      <div class="day-cell${isToday?' today':''}" data-date="${key}" ${feasts.length?`title="Feast day: ${feastTitle}"`:''}>
        <span class="day-num">${d}</span>
        ${feasts.length ? `<span class="feast-mark">★</span>` : ''}
        ${count ? `<span class="badge">${count}</span>` : ''}
      </div>`;
  }

  grid.querySelectorAll('.day-cell[data-date]').forEach(cell=>{
    cell.addEventListener('click', ()=>{
      selectedDay = new Date(cell.dataset.date + 'T00:00:00');
      cursor = new Date(selectedDay);
      setView('day');
    });
  });
}

function startOfWeek(d){
  const s = new Date(d);
  s.setDate(s.getDate() - s.getDay());
  return s;
}

function renderWeek(){
  const start = startOfWeek(cursor);
  const end = new Date(start); end.setDate(end.getDate()+6);
  $('#periodLabel').textContent = `${monthNames[start.getMonth()]} ${start.getDate()} – ${monthNames[end.getMonth()]} ${end.getDate()}`;

  const grid = $('#weekGrid');
  grid.innerHTML = '';
  for(let i=0;i<7;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const key = fmtKey(d);
    const isToday = key === fmtKey(today);
    const daySales = salesByDate[key] || [];
    const cards = daySales.map(s=>`
      <div class="mini-card" data-date="${key}">
        <span class="mini-name">${s.vendor}</span>
        ${s.items[0]}${s.items.length>1?' +more':''}
      </div>`).join('');
    grid.innerHTML += `
      <div class="week-col${isToday?' today':''}">
        <div class="week-col-head">${dowShort[i]}<br><span class="num">${d.getDate()}</span></div>
        ${cards || ''}
      </div>`;
  }

  grid.querySelectorAll('.mini-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      selectedDay = new Date(card.dataset.date + 'T00:00:00');
      cursor = new Date(selectedDay);
      setView('day');
    });
  });
}

function renderDay(){
  const key = fmtKey(selectedDay);
  const isToday = key === fmtKey(today);
  $('#periodLabel').textContent = `${dowShort[selectedDay.getDay()]}, ${monthNames[selectedDay.getMonth()]} ${selectedDay.getDate()}${isToday ? ' · Today' : ''}`;

  const daySales = salesByDate[key] || [];
  const feasts = feastsForDate(selectedDay);
  const container = $('#dayListings');
  const feastBanner = feasts.length
    ? `<div class="feast-banner">★ Feast day: ${feasts.map(f=>f.name).join(', ')}</div>`
    : '';

  if(!daySales.length){
    container.innerHTML = `${feastBanner}<div class="empty-state">No food sales posted for this day yet.</div>`;
    return;
  }
  container.innerHTML = feastBanner + daySales.map(s=>vendorCard(s,false)).join('');
  attachCardToggles(container);
}

function renderList(){
  const upcomingKeys = Object.keys(salesByDate)
    .filter(k => k >= fmtKey(today))
    .sort();

  const container = $('#listListings');

  if(!upcomingKeys.length){
    container.innerHTML = `<div class="empty-state">No upcoming food sales posted yet.</div>`;
    return;
  }

  container.innerHTML = upcomingKeys.map(key => {
    const dateObj = new Date(key + 'T00:00:00');
    const isToday = key === fmtKey(today);
    const feasts = feastsForDate(dateObj);
    const label = `${dowShort[dateObj.getDay()]}, ${monthNames[dateObj.getMonth()]} ${dateObj.getDate()}${isToday ? ' · Today' : ''}`;
    const feastBanner = feasts.length
      ? `<div class="feast-banner" style="margin-top:0;">★ Feast day: ${feasts.map(f=>f.name).join(', ')}</div>`
      : '';
    const cards = salesByDate[key].map(s=>vendorCard(s,false)).join('');
    return `
      <div style="margin-bottom:22px;">
        <p style="font-family:'Fraunces',serif;font-weight:600;font-size:1.1rem;margin:0 0 8px;${isToday?`color:var(--turquoise);`:''}">${label}</p>
        ${feastBanner}
        <div style="display:flex;flex-direction:column;gap:10px;">${cards}</div>
      </div>`;
  }).join('');

  attachCardToggles(container);
}

function render(){
  if(currentView==='month') renderMonth();
  if(currentView==='week') renderWeek();
  if(currentView==='day') renderDay();
  if(currentView==='list') renderList();
}

function setView(v){
  currentView = v;
  document.querySelectorAll('nav.views button').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  $('#view-'+v).classList.add('active');
  $('#navRow').style.display = (v === 'list') ? 'none' : 'flex';
  render();
}

/* ---------- nav controls ---------- */
document.querySelectorAll('nav.views button').forEach(btn=>{
  btn.addEventListener('click', ()=> setView(btn.dataset.view));
});

$('#prevBtn').addEventListener('click', ()=>{
  if(currentView==='month') cursor.setMonth(cursor.getMonth()-1);
  if(currentView==='week') cursor.setDate(cursor.getDate()-7);
  if(currentView==='day'){ selectedDay.setDate(selectedDay.getDate()-1); cursor = new Date(selectedDay); }
  render();
});
$('#nextBtn').addEventListener('click', ()=>{
  if(currentView==='month') cursor.setMonth(cursor.getMonth()+1);
  if(currentView==='week') cursor.setDate(cursor.getDate()+7);
  if(currentView==='day'){ selectedDay.setDate(selectedDay.getDate()+1); cursor = new Date(selectedDay); }
  render();
});
$('#todayBtn').addEventListener('click', ()=>{
  cursor = new Date(today);
  selectedDay = new Date(today);
  render();
});

$('#statusNote').textContent = 'Loading current listings…';
loadData();
</script>
</body>
</html>
